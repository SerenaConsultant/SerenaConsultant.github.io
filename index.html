<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serena Abudara</title>
<meta name="description" content="Consulting and coaching for individuals and organisations. Better decisions about people, grounded in science and data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: follows the live serenaconsultant.com look. Light header, green gradient hero with centred text and thin circles, rounded cards and pill buttons; dark green bands alternate with light sections. */
  --ink:#142019;
  --muted:#55655D;
  --deep:#1B3D31;
  --green:#24503F;
  --moss:#2F6B52;
  --leaf:#3E7A5E;
  --lime:#D6EB82;
  --bg:#F7F9F7;
  --card:#FFFFFF;
  --line:#E2E9E4;
  --head:'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
  --body:'Figtree', 'Segoe UI', Arial, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17.5px;line-height:1.65}
a{color:var(--moss)}
a:focus-visible,button:focus-visible{outline:3px solid var(--lime);outline-offset:3px;border-radius:999px}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
h1,h2,h3,h4{font-family:var(--head);color:var(--ink);margin:0;text-wrap:balance;letter-spacing:-.015em}
h2{font-size:clamp(34px,4.4vw,56px);line-height:1.05;font-weight:700}
h3{font-size:22px;line-height:1.25;font-weight:700}
h4{font-size:17px;line-height:1.35;font-weight:700;font-family:var(--body);letter-spacing:0}
p{margin:0}
.lead{color:var(--muted);font-size:19px;max-width:62ch;margin-top:18px}
section{padding:110px 0}
.ico{width:28px;height:28px;flex:none;display:block}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--body);font-weight:600;font-size:16px;text-decoration:none;padding:15px 30px;border-radius:999px;white-space:nowrap;transition:transform .2s ease, background .2s ease}
.btn:hover{transform:translateY(-2px)}
.btn.lime{background:var(--lime);color:var(--deep)}
.btn.outline{border:1.5px solid rgba(255,255,255,.55);color:#fff}
.btn.outline:hover{background:rgba(255,255,255,.08)}
.btn.dark{background:var(--green);color:#fff}

/* header */
header{position:sticky;top:0;z-index:30;background:rgba(247,249,247,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;height:88px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;white-space:nowrap}
.logo{width:50px;height:54px;display:block}
.brand span{font-family:var(--head);font-weight:700;font-size:23px;color:var(--ink);letter-spacing:-.01em}
.menu{display:flex;gap:34px}
.menu a{font-size:16.5px;color:#3A4A43;text-decoration:none;font-weight:500}
.menu a:hover{color:var(--ink)}
.right{display:flex;align-items:center;gap:16px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:#fff;padding:2px}
.lang button{border:0;background:none;font:600 14px var(--body);padding:8px 14px;border-radius:999px;color:#3A4A43;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--deep);color:#fff}
header .btn{padding:13px 24px;font-size:15.5px}
@media (max-width:1040px){.menu{display:none}}
@media (max-width:600px){header .btn{display:none}.brand span{font-size:19px}}

/* hero */
.hero{position:relative;overflow:hidden;background:radial-gradient(900px 520px at 95% 0%, #34715A 0%, rgba(52,113,90,0) 70%), linear-gradient(120deg,#1B3D31 0%,#22493B 55%,#295A47 100%);color:#fff;padding:96px 0 110px;text-align:center}
.hero .ring{position:absolute;border:1.5px solid rgba(214,235,130,.16);border-radius:50%;pointer-events:none}
.hero .r1{width:460px;height:460px;right:-150px;top:-210px}
.hero .r2{width:620px;height:620px;left:-260px;bottom:-330px}
.hero h1{color:#fff;font-size:clamp(36px,5.2vw,68px);line-height:1.06;font-weight:700;max-width:22ch;margin:0 auto}
.hero .claim{font-family:var(--head);font-weight:600;font-size:clamp(20px,2.2vw,27px);line-height:1.3;color:var(--lime);max-width:34ch;margin:30px auto 0;letter-spacing:-.005em}
.hero p.sub{font-size:19px;color:#CFE0D6;max-width:60ch;margin:26px auto 0;line-height:1.7}
.hero .ctas{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:42px}

/* services: centred intro, cards as tabs, detail panel below */
.svc-head{text-align:center;max-width:860px;margin:0 auto}
.svc-head .eyebrow{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--leaf)}
.svc-head h2{font-size:clamp(28px,3.4vw,42px);line-height:1.15;margin-top:14px}
.svc-head p{color:var(--muted);font-size:18.5px;margin:16px auto 0;max-width:62ch}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:48px}
.card{font:inherit;text-align:left;cursor:pointer;width:100%;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:30px 26px;display:flex;flex-direction:column;gap:12px;color:var(--ink);transition:transform .25s ease, box-shadow .25s ease, border-color .2s ease, background .2s ease}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 36px rgba(27,61,49,.1)}
.card[aria-selected="true"]{border-color:var(--moss);background:#F3F8F4}
.card[aria-selected="true"] .more{color:var(--ink)}
.panel{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:26px;padding:40px;animation:fadein .35s ease}
@keyframes fadein{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel .bhead + p{color:var(--muted);margin-top:12px;max-width:70ch}
.tl-light{display:grid;grid-template-columns:repeat(4,1fr);margin-top:34px}
.tl-light div{position:relative;padding:26px 18px 0 0;border-top:2px solid var(--line)}
.tl-light div::before{content:"";position:absolute;left:0;top:-9px;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--moss)}
.tl-light div:last-child::before{background:var(--moss)}
.tl-light .n{font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--leaf)}
.tl-light h4{font-family:var(--head);font-size:18px;margin-top:2px}
.tl-light p{font-size:14.5px;color:var(--muted);margin-top:2px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:36px}
.col{border-radius:20px;padding:28px;background:#F3F8F4}
.col.life{background:#F2F7DF}
.col .top{display:flex;align-items:center;gap:10px;color:var(--moss)}
.col h4{font-family:var(--head);font-size:22px;color:var(--ink)}
.col ul{margin:18px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.col li b{display:block;font-weight:700;font-size:16px}
.col li span{font-size:15px;color:var(--muted)}
@media (max-width:760px){.panel{padding:26px}.tl-light{grid-template-columns:1fr 1fr;row-gap:28px}.cols{grid-template-columns:1fr}}
.card .chip{align-self:flex-start;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:#EAF2EC;color:var(--moss)}
.card.k .chip{background:#F0F6D9;color:#5B7A1E}
.card .tag{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--leaf)}
.card h3{font-size:23px}
.card p{color:var(--muted);font-size:16px}
.card .more{margin-top:auto;padding-top:8px;font-weight:600;font-size:15px;color:var(--moss)}
@media (max-width:1000px){.cards{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.cards{grid-template-columns:1fr}}

/* dark bands */
.band{background:linear-gradient(120deg,#1B3D31 0%,#22493B 60%,#265341 100%);color:#D3E2D9;position:relative;overflow:hidden}
.band h2,.band h3,.band h4{color:#fff}
.band .lead{color:#C2D5CA}
.band .ring{position:absolute;border:1.5px solid rgba(214,235,130,.12);border-radius:50%;pointer-events:none;width:520px;height:520px;right:-240px;bottom:-260px}

/* approach: two modes + method flow */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:48px}
.mode{border-radius:22px;padding:32px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)}
.mode .tag{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.1);color:#fff}
.mode.k .tag{background:var(--lime);color:var(--deep)}
.mode .q{font-family:var(--head);font-weight:700;font-size:clamp(24px,2.6vw,32px);line-height:1.15;color:#fff;margin:18px 0 10px}
.mode p{color:#C2D5CA;font-size:16.5px}
.mode .meta{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:15px;color:#E4EEE8}
@media (max-width:760px){.modes{grid-template-columns:1fr}}

.flowhead{margin-top:88px;font-size:clamp(28px,3.4vw,44px);line-height:1.1;max-width:22ch;color:#fff}
.flowsub{margin-top:44px;font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--leaf)}
.eyebrow{font-size:13.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--leaf);margin-bottom:14px}
.band .eyebrow{color:var(--lime)}
#consulting h2,#coaching h2{max-width:22ch}
.cards.two{grid-template-columns:1fr 1fr}
@media (max-width:640px){.cards.two{grid-template-columns:1fr}}
#consulting .fstep{background:#F1F6F2}
.band .card,.band .panel{color:var(--ink)}
.band .card h3,.band .panel h3,.band .panel h4{color:var(--ink)}

/* approach: white section, cards keep the dark green look */
#approach{background:#FFFFFF;border-top:1px solid var(--line)}
#approach h2{color:var(--ink)}
#approach .lead{color:var(--muted)}
#approach .mode{display:block;text-decoration:none;background:linear-gradient(135deg,#22493B 0%,#2A5746 100%);border:1px solid #2F5E4C;transition:transform .25s ease, box-shadow .25s ease}
#approach .mode:hover{transform:translateY(-4px);box-shadow:0 18px 36px rgba(27,61,49,.18)}
.flow{margin-top:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.fstep{position:relative;border-radius:22px;padding:28px;background:#F7F9F7;color:var(--ink)}
.fstep:not(:last-child)::after{content:"→";position:absolute;right:-17px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:var(--lime);color:var(--deep);display:grid;place-items:center;font-weight:700;z-index:2;font-size:15px}
.fviz{height:72px;display:flex;align-items:flex-end;gap:8px;margin-bottom:18px}
.fbar{width:20px;border-radius:6px 6px 2px 2px;background:#9CC0AC;transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.fstep:nth-child(3) .fbar{background:var(--moss)}
.fbar:nth-child(2){animation-delay:.12s}.fbar:nth-child(3){animation-delay:.24s}.fbar:nth-child(4){animation-delay:.36s}
.fstep:nth-child(3) .fbar{animation-delay:1.2s}.fstep:nth-child(3) .fbar:nth-child(2){animation-delay:1.32s}.fstep:nth-child(3) .fbar:nth-child(3){animation-delay:1.44s}.fstep:nth-child(3) .fbar:nth-child(4){animation-delay:1.56s}
.check{width:58px;height:58px;border-radius:50%;background:var(--lime);display:grid;place-items:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) .8s both}
.check svg{width:28px;height:28px}
.trend{margin-left:6px;align-self:flex-start}
.trend path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .8s ease 1.9s forwards}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
.fstep .n{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--leaf)}
.band .fstep h3{margin-top:4px;color:var(--ink)}
.fstep p{color:var(--muted);font-size:15.5px;margin-top:4px}
@media (max-width:760px){.flow{grid-template-columns:1fr}.fstep:not(:last-child)::after{content:"↓";right:auto;left:50%;top:auto;bottom:-17px;transform:translateX(-50%)}}

/* consulting detail */
.block{margin-top:56px}
.bhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bhead .chip{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:#EAF2EC;color:var(--moss)}
.bhead h3{font-size:30px;flex:1}
.pill{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:7px 14px;border-radius:999px;background:#EAF2EC;color:var(--moss)}
.bhead + p{color:var(--muted);margin-top:12px;max-width:66ch}
.rows{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px}
.row{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}
.row p{font-size:15.5px;color:var(--muted);margin-top:6px}
@media (max-width:960px){.rows{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.rows{grid-template-columns:1fr}}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}
.area{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;transition:box-shadow .25s ease}
.area:hover{box-shadow:0 16px 32px rgba(27,61,49,.08)}
.area-top{display:flex;align-items:center;gap:12px}
.area-top .ico{color:var(--moss)}
.area h4{font-family:var(--head);font-size:21px;letter-spacing:-.01em}
.area ul{margin:16px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.area li{font-size:15px;padding:7px 14px;border-radius:999px;background:#F1F5F2;color:var(--ink)}
@media (max-width:760px){.areas{grid-template-columns:1fr}}

/* coaching detail (band) */
.timeline{display:grid;grid-template-columns:repeat(4,1fr);margin-top:48px}
.tli{position:relative;padding:30px 20px 0 0;border-top:2px solid rgba(255,255,255,.2)}
.tli::before{content:"";position:absolute;left:0;top:-9px;width:16px;height:16px;border-radius:50%;background:#22493B;border:2px solid var(--lime)}
.tli:last-child::before{background:var(--lime)}
.tli .n{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--lime)}
.tli h4{font-size:19px;margin-top:4px;font-family:var(--head)}
.tli p{font-size:15px;color:#C2D5CA;margin-top:4px}
@media (max-width:760px){.timeline{grid-template-columns:1fr 1fr;row-gap:32px}}
.arms{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:56px}
.arm{border-radius:22px;padding:32px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)}
.arm.life{background:#F7F9F7;border-color:#F7F9F7}
.arm.life h3,.arm.life h4{color:var(--ink)}
.arm .top{display:flex;align-items:center;gap:12px}
.arm .top .ico{color:var(--lime)}
.arm.life .top .ico{color:var(--moss)}
.arm h3{font-size:28px}
.arm .lbl{display:block;margin:22px 0 10px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lime)}
.arm.life .lbl{color:var(--leaf)}
.arm ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.arm li b{display:block;font-weight:700;font-size:16px;color:#fff}
.arm li span{font-size:15px;color:#C2D5CA}
.arm.life li b{color:var(--ink)}
.arm.life li span{color:var(--muted)}
@media (max-width:860px){.arms{grid-template-columns:1fr}}

/* about */
.about{max-width:820px}
.about .role{color:var(--leaf);font-weight:600;font-size:17px;margin-top:12px}
.about-text{margin-top:34px;padding-left:26px;border-left:3px solid var(--lime)}
.about-text p{font-size:21px;line-height:1.55;color:var(--ink);max-width:62ch}
.about-text p + p{margin-top:18px;color:var(--muted);font-size:17.5px;line-height:1.7}

/* contact */
.cgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:56px;align-items:start}
.cbtns{display:flex;flex-wrap:wrap;gap:14px;margin-top:32px}
.cinfo{border-radius:22px;padding:30px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;gap:16px}
.cinfo p{color:#fff;font-size:16.5px}
.cinfo p span{display:block;font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#9DBDAC}
.cinfo a{color:#fff}
@media (max-width:860px){.cgrid{grid-template-columns:1fr}}
footer{background:#14302A;color:#9DBDAC;font-size:14.5px;padding:24px 0}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}.trend path{stroke-dashoffset:0}}
</style>
</head>
<body>
<header>
  <div class="wrap topbar">
    <a class="brand" href="#top" aria-label="Serena Abudara, home">
      <svg class="logo" viewBox="0 0 50 54" aria-hidden="true"><text x="1" y="36" font-family="'Cormorant Garamond', Georgia, serif" font-size="46" font-weight="400" fill="#1B3D31">S</text><text x="17" y="50" font-family="'Cormorant Garamond', Georgia, serif" font-size="46" font-weight="400" fill="#3E7A5E">C</text></svg>
      <span>Serena Abudara</span>
    </a>
    <nav class="menu" id="menu" aria-label="Main"></nav>
    <div class="right" id="right"></div>
  </div>
</header>

<main id="top">
  <section class="hero"><span class="ring r1"></span><span class="ring r2"></span><div class="wrap" id="hero-in"></div></section>
  <section id="approach"><div class="wrap" id="appr-in"></div></section>
  <section id="consulting"><div class="wrap" id="cons-in"></div></section>
  <section class="band" id="coaching"><span class="ring"></span><div class="wrap" id="coach-in"></div></section>
  <section id="about"><div class="wrap about" id="about-in"></div></section>
  <section class="band" id="contact"><span class="ring"></span><div class="wrap" id="contact-in"></div></section>
</main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
const PHONE = '+90 553 263 93 27';
const WA = 'https://wa.me/905532639327';
const LI = 'https://www.linkedin.com/in/serena-abudara-ba2102184';
const EMAIL = 'serena@serenaconsultant.com';
const PLACE = 'Ataşehir, İstanbul';

const I = {
  compass:'<circle cx="16" cy="16" r="12"/><path d="M20.5 11.5 L17.5 17.5 L11.5 20.5 L14.5 14.5 Z"/>',
  network:'<circle cx="16" cy="7" r="3.5"/><circle cx="7" cy="24" r="3.5"/><circle cx="25" cy="24" r="3.5"/><path d="M14.3 10 L8.8 21 M17.7 10 L23.2 21 M10.5 24 H21.5"/>',
  path:'<path d="M5 27 C 12 27, 10 17, 17 17 S 22 8, 27 8"/><path d="M25 4 V12 M25 4 L30 6 L25 8"/>',
  people:'<circle cx="11" cy="11" r="4"/><circle cx="22" cy="12" r="3.5"/><path d="M3.5 26 C 4 19, 18 19, 18.5 26 M17 20 C 22 17.5, 28.5 19.5, 28.5 26"/>',
  star:'<path d="M16 4 L19.5 12 L28 12.8 L21.5 18.4 L23.5 27 L16 22.5 L8.5 27 L10.5 18.4 L4 12.8 L12.5 12 Z"/>',
  grid:'<rect x="5" y="5" width="9" height="9" rx="2"/><rect x="18" y="5" width="9" height="9" rx="2"/><rect x="5" y="18" width="9" height="9" rx="2"/><rect x="18" y="18" width="9" height="9" rx="2"/>',
  pulse:'<path d="M3 17 H9 L12 9 L17 25 L21 13 L23 17 H29"/>',
  chart:'<path d="M5 5 V27 H28"/><path d="M10 22 V17 M16 22 V12 M22 22 V8"/>',
  rise:'<path d="M4 26 L12 18 L17 22 L28 9"/><path d="M21 9 H28 V16"/>',
  leaf:'<path d="M6 26 C 6 12, 16 5, 27 5 C 27 17, 20 26, 6 26 Z"/><path d="M6 26 L18 14"/>'
};
const icon = n => `<svg class="ico" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const CHECK = '<svg viewBox="0 0 28 28" fill="none" stroke="#1B3D31" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14.5 L12 19.5 L21.5 9"/></svg>';
const TREND = '<svg class="trend" width="70" height="40" viewBox="0 0 70 40" fill="none"><path d="M4 34 L24 22 L36 27 L64 6" stroke="#2F6B52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const $ = id => document.getElementById(id);
const state = { cons: 0, coach: 2 };

/* Two cards that open their details below, without leaving the section. */
function tabs(t, key, idxs){
  const s = t.svc;
  return `<div class="cards two" role="tablist">${idxs.map(i=>{const c=s.cards[i]; return `<button type="button" role="tab" id="tab${i}" aria-controls="panel-${key}" aria-selected="${i===state[key]}" class="card${c.k?' k':''}" data-i="${i}" data-key="${key}"><span class="chip">${icon(c.i)}</span><span class="tag">${c.tag}</span><h3>${c.t}</h3><p>${c.p}</p><span class="more">${s.more}</span></button>`;}).join('')}</div>
    <div class="panel" id="panel-${key}" role="tabpanel" aria-labelledby="tab${state[key]}">${panel(t, state[key])}</div>`;
}
function bindTabs(t){
  document.querySelectorAll('.card[data-key]').forEach(b => b.addEventListener('click', () => {
    const key = b.dataset.key; state[key] = +b.dataset.i;
    document.querySelectorAll(`.card[data-key="${key}"]`).forEach(x => x.setAttribute('aria-selected', x === b));
    const p = $('panel-' + key);
    p.setAttribute('aria-labelledby', 'tab' + state[key]);
    p.innerHTML = panel(t, state[key]);
    p.style.animation = 'none'; void p.offsetWidth; p.style.animation = '';
    const r = p.getBoundingClientRect();
    if (r.top > window.innerHeight - 120) p.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }));
}

/* Detail panel for the selected service card. */
function panel(t, i){
  const c = t.cons, k = t.coach, s = t.svc, card = s.cards[i];
  const head = (ic, title, pill) => `<div class="bhead"><span class="chip">${icon(ic)}</span><h3>${title}</h3><span class="pill">${pill}</span></div>`;
  const tl = `<div class="tl-light">${k.tl.map(([x,y],n)=>`<div><span class="n">0${n+1}</span><h4>${x}</h4><p>${y}</p></div>`).join('')}</div>`;
  const list = items => `<ul>${items.map(([x,y])=>`<li><b>${x}</b><span>${y}</span></li>`).join('')}</ul>`;
  const [career, life] = k.arms;
  if (i === 0) return head('compass', c.ind.t, c.ind.s) + `<p>${c.ind.p}</p>
    <div class="rows">${c.ind.rows.map(([x,y])=>`<div class="row"><h4>${x}</h4><p>${y}</p></div>`).join('')}</div>`;
  if (i === 1) return head('network', c.org.t, c.org.s) + `<p>${c.org.p}</p>
    <div class="areas">${c.org.areas.map(([ic,x,items])=>`<div class="area"><div class="area-top">${icon(ic)}<h4>${x}</h4></div><ul>${items.map(it=>`<li>${it}</li>`).join('')}</ul></div>`).join('')}</div>`;
  if (i === 2) return head('path', card.t, k.ind) + `<p>${s.p2}</p>${tl}
    <div class="cols"><div class="col"><div class="top">${icon('rise')}<h4>${s.careerT}</h4></div>${list(career.ind)}</div>
    <div class="col life"><div class="top">${icon('leaf')}<h4>${s.lifeT}</h4></div>${list(life.ind)}</div></div>`;
  return head('people', card.t, k.org) + `<p>${s.p3}</p>${tl}
    <div class="cols"><div class="col"><div class="top">${icon('rise')}<h4>${s.careerT}</h4></div>${list(career.org)}</div>
    <div class="col life"><div class="top">${icon('leaf')}<h4>${s.lifeT}</h4></div>${list(life.org)}</div></div>`;
}

  $('right').innerHTML = `<div class="lang" role="group" aria-label="Language"><button type="button" data-l="en" aria-pressed="${lang==='en'}">EN</button><button type="button" data-l="tr" aria-pressed="${lang==='tr'}">TR</button></div><a class="btn dark" href="#contact">${t.book}</a>`;

  const h = t.hero;
  $('hero-in').innerHTML = `<h1>${h.claim}</h1><p class="sub">${h.sub}</p>
    <div class="ctas"><a class="btn lime" href="#contact">${t.book}</a><a class="btn outline" href="#approach">${t.see}</a></div>`;

  const a = t.appr;
  $('appr-in').innerHTML = `<h2>${a.h}</h2><p class="lead">${a.lead}</p>
    <div class="modes">${a.modes.map(([l,q,p,m],i)=>`<a class="mode${i?' k':''}" href="#${i?'coaching':'consulting'}"><span class="tag">${l}</span><p class="q">“${q}”</p><p>${p}</p><p class="meta">${m}</p></a>`).join('')}</div>`;

  const viz = [
    `<div class="fviz">${[34,52,44,60].map(v=>`<span class="fbar" style="height:${v}%"></span>`).join('')}</div>`,
    `<div class="fviz"><span class="check">${CHECK}</span></div>`,
    `<div class="fviz">${[58,76,70,96].map(v=>`<span class="fbar" style="height:${v}%"></span>`).join('')}${TREND}</div>`];
  const c = t.cons;
  $('cons-in').innerHTML = `<p class="eyebrow">${c.h}</p><h2>${h.h1}</h2><p class="lead">${c.lead}</p>
    <p class="flowsub">${a.flowhead}</p>
    <div class="flow">${a.flow.map(([n,ti,p],i)=>`<div class="fstep">${viz[i]}<span class="n">${n}</span><h3>${ti}</h3><p>${p}</p></div>`).join('')}</div>
    ${tabs(t, 'cons', [0,1])}`;

  const k = t.coach;
  $('coach-in').innerHTML = `<p class="eyebrow">${k.h}</p><h2>${k.h2}</h2><p class="lead">${k.lead}</p>${tabs(t, 'coach', [2,3])}`;
  bindTabs(t);


  const ab = t.about;
  $('about-in').innerHTML = `<p class="eyebrow">${ab.h}</p><h2>Serena Abudara</h2><p class="role">${ab.role}</p><div class="about-text"><p>${ab.t1}</p><p>${ab.t2}</p></div>`;

  const ct = t.contact;
  $('contact-in').innerHTML = `<div class="cgrid">
    <div><h2>${ct.h}</h2><p class="lead">${ct.lead}</p><div class="cbtns"><a class="btn lime" href="${WA}">${ct.wa}</a><a class="btn outline" href="mailto:${EMAIL}">${ct.mail}</a></div></div>
    <div class="cinfo">
      <p><span>${ct.phone}</span>${PHONE}</p>
      <p><span>${ct.email}</span><a href="mailto:${EMAIL}">${EMAIL}</a></p>
      <p><span>${ct.loc}</span>${PLACE}</p>
      <p><span>${ct.li}</span><a href="${LI}">linkedin.com/in/serena-abudara-ba2102184</a></p>
    </div></div>`;

  $('foot').innerHTML = t.foot.map(x=>`<span>${x}</span>`).join('');

  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
    try { localStorage.setItem('sc-lang', b.dataset.l); } catch(e) {}
    render(b.dataset.l);
  }));
}

let start = 'en';
try { const saved = localStorage.getItem('sc-lang'); if (saved === 'tr' || saved === 'en') start = saved; } catch(e) {}
render(start);
